<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050505" />
  <meta name="description"
    content="Pratham — Cinematographer, Director of Photography & Camera Operator. Stories told through light, movement, and feeling. Available for collaborations worldwide." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=Manrope:wght@400;500;600;650;700;750;800&display=swap"
    rel="stylesheet" />
  <title>Pratham — Cinematographer & Director of Photography</title>
  <style>
    .site-loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      background: #050505;
      color: #c5b294;
    }

    .site-loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      font: 14px/1.5 sans-serif;
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="site-loader" role="status">
      <div class="site-loader-content">
        <img src="/clapperboard-loader.svg" width="96" height="96" alt="" aria-hidden="true" />
        <span>Loading…</span>
      </div>
    </div>
  </div>
  <noscript>
    <style>
      .site-loader {
        display: none;
      }
    </style>Please enable JavaScript to view the portfolio.
  </noscript>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
